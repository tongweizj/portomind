name: "Story（用户故事）"
description: "一条用户价值：范围、验收条件、下挂 Task"
title: "[US] "
labels: ["type:story"]
body:
  - type: markdown
    attributes:
      value: |
        > 本仓库为 **public**，Issue 正文与评论公开可见。
        > 禁止写入真实持仓、金额、账号、密码、`MONGO_URI` 或任何凭据。
        > 状态由 Projects 的 `Status` 字段维护，不在正文重复书写。

  - type: input
    id: story-ref
    attributes:
      label: Story 编号
      description: "新 Story 用 US-下一个编号；迁移的历史 Story 沿用原编号"
      placeholder: "US-006"
    validations:
      required: true

  - type: textarea
    id: value
    attributes:
      label: 用户价值
      description: "为什么做，解决谁的什么问题"
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 范围 / 非目标
      description: "明确不做什么，避免实施时自行扩范围"
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 验收条件（AC）
      description: "逐条、可观测；一条一行"
      placeholder: "- [ ] ..."
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: 下挂 Task
      description: "用子 Issue 或 #NN 关联；依赖关系用 GitHub 的 blocked by"

  - type: textarea
    id: acceptance-record
    attributes:
      label: 整体验收记录
      description: "关闭前由 Human 填写：日期、结论、PR 与验证结果索引"

  - type: checkboxes
    id: sanitized
    attributes:
      label: 提交确认
      options:
        - label: 正文不含真实财务数据与凭据
          required: true
