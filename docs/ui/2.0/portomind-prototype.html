<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PortoMind · 产品原型 v2.0</title>
<style>
  :root{
    --brand:#635BFF; --brand-hov:#5247DB; --brand-surf:#EEEDFF; --brand-surf-hov:#E0DEFF;
    --bg:#F6F8FA; --card:#FFFFFF; --border:#E3E8EE; --border-strong:#D7DEE6;
    --ink:#0A2540; --ink2:#5E6B7E; --muted:#8A95A5;
    --up:#DF1B41; --down:#0E9F6E; --warn:#F5A524; --warn-t:#B26A00; --warn-bg:#FEF6E7; --danger:#E0254B;
    --r-sm:6px; --r-md:8px; --r-lg:10px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:"Noto Sans SC","Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    background:var(--bg); color:var(--ink); font-size:14px; line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .num{font-family:"Inter","Noto Sans SC",system-ui,sans-serif; font-variant-numeric:tabular-nums;}
  a{color:var(--brand); text-decoration:none;}
  a:hover{text-decoration:underline;}

  /* ===== 布局 ===== */
  .app{display:flex; min-height:100vh;}
  .sidebar{
    width:232px; flex:0 0 232px; background:var(--bg); border-right:1px solid var(--border);
    position:fixed; top:0; left:0; bottom:0; z-index:40; display:flex; flex-direction:column;
  }
  .s-logo{display:flex; align-items:center; gap:10px; padding:24px 24px 8px;}
  .s-logo .mark{width:28px;height:28px;background:var(--brand);border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;}
  .s-logo .name{font-size:18px;font-weight:700;letter-spacing:.2px;}
  .s-group{color:var(--muted);font-size:12px;padding:20px 24px 8px;}
  .s-nav{flex:1;padding:0 12px;display:flex;flex-direction:column;gap:4px;overflow:auto;}
  .s-item{
    display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:var(--r-md);
    color:var(--ink2);font-weight:500;cursor:pointer;transition:all .15s;user-select:none;font-size:14px;
  }
  .s-item:hover{color:var(--ink);background:#EEF1F5;}
  .s-item.on{color:var(--brand);font-weight:600;background:var(--brand-surf);}
  .s-item svg{width:18px;height:18px;flex:0 0 18px;}
  .s-badge{margin-left:auto;font-size:10px;line-height:1.6;padding:0 7px;border-radius:999px;background:var(--border);color:var(--ink2);}
  .s-item.on .s-badge{background:var(--card);color:var(--brand);}
  .s-chev{margin-left:auto;transition:transform .15s;color:var(--muted);font-size:11px;}
  .s-chev.open{transform:rotate(90deg);}
  .s-item.on .s-chev{color:var(--brand);}
  .s-child{padding:6px 0 6px 44px;border-radius:var(--r-md);color:var(--ink2);font-weight:500;font-size:13px;cursor:pointer;}
  .s-child:hover{color:var(--ink);}
  .s-child.on{color:var(--brand);font-weight:600;background:var(--brand-surf);}
  /* 侧栏底部：只剩分隔线 + 版本号（TASK-060 M-01/M-02 / E4·E5 —— 侧栏不提供任何账户入口） */
  .s-bottom{padding:0 12px 16px;}
  .s-sep{height:1px;background:var(--border);margin:0 12px 12px;}
  .s-ver{color:var(--muted);font-size:12px;padding:8px 16px 0;}

  .main{flex:1;margin-left:232px;min-width:0;display:flex;flex-direction:column;}
  .topbar{
    height:64px;flex:0 0 64px;background:var(--card);border-bottom:1px solid var(--border);
    display:flex;align-items:center;gap:16px;padding:0 32px;position:sticky;top:0;z-index:30;
  }
  .tb-title{font-size:16px;font-weight:700;}
  .tb-spacer{flex:1;}
  .tb-search{position:relative;}
  .tb-search input{
    width:260px;border:1px solid var(--border);border-radius:var(--r-md);padding:8px 12px 8px 32px;
    font-size:13px;outline:none;background:var(--bg);color:var(--ink);transition:border .15s;
  }
  .tb-search input:focus{border-color:var(--brand);background:var(--card);}
  .tb-search .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;}
  .gs-drop{
    position:absolute;top:calc(100% + 6px);right:0;width:320px;background:var(--card);border:1px solid var(--border);
    border-radius:var(--r-lg);box-shadow:0 12px 32px rgba(10,37,64,.12);display:none;max-height:320px;overflow:auto;z-index:60;
  }
  .gs-drop.show{display:block;}
  .gs-item{padding:10px 14px;cursor:pointer;display:flex;gap:10px;align-items:center;}
  .gs-item:hover{background:var(--bg);}
  .gs-item .k{font-weight:600;}
  .gs-item .d{color:var(--muted);font-size:12px;}
  .gs-none{padding:14px;color:var(--muted);font-size:13px;text-align:center;}
  .avatar{width:32px;height:32px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;cursor:pointer;}
  .content{padding:24px 32px 64px;flex:1;min-width:0;}

  /* ===== 顶栏头像下拉（TASK-060 M-03 / A-15 / D11·D12）
     面板 = 身份行（只读，非 a/button）+ 分隔线 + 账户设置 + 退出登录，恰两个动作 ===== */
  .user-menu{position:relative;}
  .um-trigger{background:none;border:none;padding:0;cursor:pointer;display:flex;border-radius:50%;font-family:inherit;}
  .um-trigger:focus-visible{outline:2px solid var(--brand);outline-offset:3px;}
  .um-panel{position:absolute;right:0;top:calc(100% + 8px);width:200px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:0 12px 32px rgba(10,37,64,.14);padding:6px;display:none;z-index:50;}
  .um-panel.show{display:block;}
  /* 身份行：用户名 + 角色同一行；角色弱化（muted，不用 chip 强调） */
  .um-id{padding:9px 12px 8px;display:flex;align-items:center;gap:8px;cursor:default;}
  .um-name{font-size:13px;font-weight:700;color:var(--ink);}
  .um-role{font-size:12px;font-weight:500;color:var(--muted);}
  .um-sep{height:1px;background:var(--border);margin:4px 6px;}
  .um-row{display:block;width:100%;text-align:left;padding:8px 12px;border-radius:var(--r-sm);font-size:13px;font-weight:500;color:var(--ink2);cursor:pointer;border:none;background:none;font-family:inherit;transition:all .15s;}
  .um-row:hover{background:#EEF1F5;color:var(--ink);}
  .um-row:disabled{opacity:.45;cursor:not-allowed;}
  .um-row:disabled:hover{background:none;color:var(--ink2);}
  .um-row[hidden]{display:none;}
  .um-row.danger{color:var(--danger);}
  .um-row.danger:hover{background:#FDECEF;color:var(--danger);}

  /* ===== 登录屏（无侧栏/顶栏）与强制改密闸门 ===== */
  body.authed-off .sidebar,
  body.authed-off .topbar{display:none;}
  body.authed-off .main{margin-left:0;}
  body.authed-off .content{padding:0;}
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(160deg,#F6F8FA 0%,#EEEDFF 100%);}
  .login-card{width:400px;max-width:100%;background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:0 20px 48px rgba(10,37,64,.12);overflow:hidden;}
  .login-head{padding:28px 28px 8px;display:flex;align-items:center;gap:12px;}
  .login-head .mark{width:36px;height:36px;background:var(--brand);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;}
  .login-head .t{font-size:19px;font-weight:700;}
  .login-head .s{font-size:12px;color:var(--muted);}
  .login-body{padding:8px 28px 28px;}
  .demo-note{background:var(--brand-surf);border:1px solid #D9D6FF;border-radius:8px;padding:10px 12px;font-size:12px;color:var(--brand-hov);margin-bottom:18px;line-height:1.6;}
  .demo-note b{color:var(--brand);}
  .center-screen{display:flex;align-items:center;justify-content:center;padding:24px;flex-direction:column;gap:14px;text-align:center;min-height:calc(100vh - 160px);}

  /* 注：账户页页内 Tab（.ptabs/.ptab）已于 2026-10-27 随「系统设置独立成页」移除，
     系统设置改由顶栏下拉进入（D13）。此处不再保留无引用的样式。 */
  .kv{display:grid;grid-template-columns:120px 1fr;gap:10px 14px;font-size:13px;align-items:center;}
  .kv .k{color:var(--muted);}
  .kv .v{font-weight:600;}

  /* ===== 通用 ===== */
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);}
  .card-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border);}
  .card-t{font-size:14px;font-weight:700;}
  .card-sub{font-size:12px;color:var(--muted);}
  .card-b{padding:16px 18px;}
  .card-link{margin-left:auto;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;}
  .page-head{margin-bottom:18px;}
  .ph-title{font-size:22px;font-weight:700;letter-spacing:.2px;}
  .ph-desc{color:var(--ink2);font-size:13px;margin-top:2px;}
  .head-row{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;}
  .spacer{flex:1;}
  .btn{
    display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--card);color:var(--ink);
    border-radius:var(--r-md);padding:8px 14px;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap;
  }
  .btn:hover{border-color:var(--brand);color:var(--brand);}
  .btn-pri{background:var(--brand);border-color:var(--brand);color:#fff;}
  .btn-pri:hover{background:var(--brand-hov);border-color:var(--brand-hov);color:#fff;}
  .btn-pri:disabled{opacity:.45;cursor:not-allowed;}
  .btn-sm{padding:5px 10px;font-size:12px;border-radius:var(--r-sm);}
  .btn-danger{color:var(--danger);}
  .btn-danger:hover{border-color:var(--danger);color:var(--danger);}
  .chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;background:#F1F3F7;color:var(--ink2);white-space:nowrap;}
  .c-purple{background:var(--brand-surf);color:var(--brand);}
  .c-green{background:#E8F7F0;color:var(--down);}
  .c-blue{background:#E5F4FB;color:#0284C7;}
  .c-amber{background:var(--warn-bg);color:var(--warn-t);}
  .c-red{background:#FDECEF;color:var(--danger);}
  .c-gray{background:#F1F3F7;color:var(--muted);}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 8px;}

  .chg-up{color:var(--up);font-weight:600;}
  .chg-down{color:var(--down);font-weight:600;}
  .chg-flat{color:var(--muted);}
  .muted{color:var(--muted);}
  .warn-text{color:var(--warn-t);font-weight:600;}

  /* 表格 */
  .tbl-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;}
  table.tb{width:100%;border-collapse:collapse;font-size:13px;}
  .tb th{
    text-align:left;font-size:12px;color:var(--ink2);font-weight:600;padding:10px 14px;
    background:#FBFCFD;border-bottom:1px solid var(--border);white-space:nowrap;
  }
  .tb td{padding:11px 14px;border-bottom:1px solid #F1F3F7;vertical-align:middle;}
  .tb tr:last-child td{border-bottom:none;}
  .tb tbody tr.rowlink{cursor:pointer;transition:background .12s;}
  .tb tbody tr.rowlink:hover{background:var(--bg);}
  .tb .r{text-align:right;}
  .tb th.r{text-align:right;}
  .asset-cell .n{font-weight:600;}
  .asset-cell .s{font-size:12px;color:var(--muted);}
  .tbl-foot{display:flex;align-items:center;padding:10px 14px;font-size:12px;color:var(--muted);border-top:1px solid var(--border);background:#FBFCFD;}
  .pager{margin-left:auto;display:flex;gap:6px;align-items:center;}
  .pager .pg{min-width:26px;height:26px;border:1px solid var(--border);border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;cursor:pointer;background:var(--card);color:var(--ink2);font-size:12px;padding:0 6px;}
  .pager .pg.on{background:var(--brand);border-color:var(--brand);color:#fff;}

  /* KPI */
  .kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 16px;}
  .kpi .l{font-size:12px;color:var(--muted);}
  .kpi .v{font-size:24px;font-weight:700;margin-top:4px;letter-spacing:.2px;}
  .kpi .s{font-size:12px;margin-top:2px;}

  /* Tabs / Segmented */
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px;flex-wrap:wrap;}
  .tab{padding:9px 14px;font-size:14px;font-weight:500;color:var(--ink2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;}
  .tab:hover{color:var(--ink);}
  .tab.on{color:var(--brand);font-weight:600;border-bottom-color:var(--brand);}
  .seg{display:inline-flex;background:#F1F3F7;border-radius:var(--r-md);padding:3px;gap:2px;}
  .seg-btn{padding:6px 14px;font-size:13px;font-weight:500;color:var(--ink2);border-radius:6px;cursor:pointer;transition:all .15s;border:none;background:transparent;}
  .seg-btn.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(10,37,64,.08);}

  /* 工具栏 */
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
  .input,.select{
    border:1px solid var(--border);border-radius:var(--r-md);padding:8px 12px;font-size:13px;outline:none;
    background:var(--card);color:var(--ink);transition:border .15s;font-family:inherit;
  }
  .input:focus,.select:focus{border-color:var(--brand);}
  .input.err{border-color:var(--danger);}
  .search-box{position:relative;}
  .search-box .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;}
  .search-box .input{padding-left:30px;width:240px;}
  .count{font-size:12px;color:var(--muted);}
  /* 加载骨架（原 auth 原型 A-13，合并后统一在此定义） */
  .skel-row{display:flex;gap:14px;padding:12px 14px;border-bottom:1px solid #F1F3F7;}
  .skel{height:12px;border-radius:6px;background:linear-gradient(90deg,#EDF0F4 25%,#F6F8FA 37%,#EDF0F4 63%);background-size:400% 100%;animation:sk 1.4s ease infinite;}
  @keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}

  /* ===== 任务运行看板（TASK-061 / FS-cron-worker-status-board） =====
     系统态色：红=坏 · 绿=好 —— 与行情「红涨绿跌」语义无关，图例须书面区分 */
  .cron-overview{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 0 4px;}
  .hl-wrap{display:flex;gap:14px;flex-wrap:wrap;}
  .hl{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2);}
  .cron-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin:12px 0;}
  .cron-card .ph-title{font-size:15px;font-weight:600;}
  .cron-card .knum{font-size:13px;margin:8px 0;color:var(--ink);}
  .cron-card .note{font-size:12px;color:var(--warn-t);background:var(--warn-bg);padding:4px 8px;border-radius:6px;margin:4px 0;}
  .cron-card .card-actions{margin-top:8px;display:flex;gap:14px;}
  .cron-card .run-state{font-size:11px;color:var(--muted);margin:2px 0 6px;letter-spacing:.02em;}
  .pbar{height:8px;background:#F1F3F7;border-radius:999px;overflow:hidden;margin:8px 0;}
  .pbar-f{height:100%;background:var(--brand);border-radius:999px;}
  .cron-legend{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--border);margin-top:6px;}
  .link{color:var(--brand);cursor:pointer;font-size:13px;font-weight:500;}
  .link:hover{text-decoration:underline;}
  .cron-ro{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:10px;padding:8px 12px;background:#FBFCFD;border:1px solid var(--border);border-radius:var(--r-md);}
  .crumbs{font-size:13px;color:var(--muted);margin-bottom:10px;}
  /* F2：详情页操作列两个链接同格并排，须留间距（否则粘连成一个） */
  .act-cell{display:flex;gap:12px;align-items:center;}

  /* 表单 */
  .field{margin-bottom:14px;}
  .flabel{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:6px;}
  .input-full{width:100%;}
  .frow{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .frow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  .fhint{font-size:12px;color:var(--muted);margin-top:4px;}
  .ferr{font-size:12px;color:var(--danger);margin-top:4px;font-weight:600;}
  .radio-row{display:flex;gap:16px;align-items:center;}
  .radio-row label{display:flex;gap:6px;align-items:center;font-size:13px;cursor:pointer;}
  .sum-line{font-size:12px;font-weight:700;}
  .sum-line.ok{color:var(--down);}
  .sum-line.bad{color:var(--danger);}

  /* Modal */
  .mask{position:fixed;inset:0;background:rgba(10,37,64,.4);z-index:90;display:none;align-items:flex-start;justify-content:center;padding:60px 20px;overflow:auto;}
  .mask.show{display:flex;}
  .modal{background:var(--card);border-radius:12px;width:600px;max-width:100%;box-shadow:0 24px 64px rgba(10,37,64,.25);animation:pop .18s ease;}
  @keyframes pop{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  .m-head{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);}
  .m-title{font-size:15px;font-weight:700;}
  .m-x{margin-left:auto;cursor:pointer;color:var(--muted);font-size:16px;line-height:1;padding:4px;}
  .m-x:hover{color:var(--ink);}
  .m-body{padding:18px 20px;max-height:62vh;overflow:auto;}
  .m-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--border);}

  /* Toast */
  .toast-wrap{position:fixed;right:24px;bottom:24px;z-index:120;display:flex;flex-direction:column;gap:10px;}
  .toast{
    background:var(--ink);color:#fff;padding:11px 16px;border-radius:10px;font-size:13px;max-width:380px;
    box-shadow:0 10px 30px rgba(0,0,0,.25);animation:tin .25s ease;
  }
  .toast.err{background:var(--danger);}
  .toast.ok{background:var(--down);}
  @keyframes tin{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

  /* Switch */
  .switch{position:relative;width:34px;height:20px;flex:0 0 34px;cursor:pointer;}
  .switch input{display:none;}
  .switch .sl{position:absolute;inset:0;background:#CBD5E1;border-radius:999px;transition:background .15s;}
  .switch .sl::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s;}
  .switch input:checked + .sl{background:var(--brand);}
  .switch input:checked + .sl::after{left:16px;}

  /* 菜单 */
  .menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:0 10px 28px rgba(10,37,64,.14);min-width:150px;z-index:50;display:none;}
  .menu.show{display:block;}
  .menu-item{padding:9px 14px;font-size:13px;cursor:pointer;color:var(--ink);}
  .menu-item:hover{background:var(--bg);}
  .menu-item.danger{color:var(--danger);}

  /* 提示条 */
  .banner{display:flex;align-items:center;gap:10px;border-radius:var(--r-md);padding:12px 16px;font-size:13px;}
  .banner-warn{background:#FDECEF;color:#9F1239;border:1px solid #F8C9D4;}
  .banner-warn .t{font-weight:600;}
  .banner-amber{background:var(--warn-bg);color:var(--warn-t);border:1px solid #F5E3B8;}

  /* 空态 */
  .empty{padding:44px 20px;text-align:center;color:var(--muted);font-size:13px;}
  .empty .em{font-size:30px;display:block;margin-bottom:8px;opacity:.5;}

  /* Dashboard 桶卡/健康表 */
  .bucket-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;}

  .pcard:hover{box-shadow:0 8px 24px rgba(10,37,64,.08);}
  .pcard.new{align-items:center;justify-content:center;color:var(--muted);cursor:pointer;border-style:dashed;min-height:220px;}
  .pcard.new:hover{border-color:var(--brand);color:var(--brand);}
  .pcard.archived{opacity:.55;}
  .p-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;font-size:12px;}
  .p-meta .k{color:var(--muted);}
  .p-meta .v{font-weight:600;}
  .bar-stack{display:flex;height:14px;border-radius:999px;overflow:hidden;background:#F1F3F7;}
  .bar-seg{cursor:pointer;transition:opacity .15s;}
  .bar-seg:hover{opacity:.8;}
  .legend-row{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;}
  .legend-item{display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;color:var(--ink2);}
  .legend-item:hover{color:var(--ink);}

  /* 事件列表 */
  .ev-row{display:flex;gap:10px;align-items:flex-start;padding:11px 18px;border-bottom:1px solid #F1F3F7;cursor:pointer;}
  .ev-row:last-child{border-bottom:none;}
  .ev-row:hover{background:var(--bg);}
  .ev-row.unread .ev-text{font-weight:600;}
  .ev-row.read{opacity:.62;}
  .ev-text{font-size:13px;flex:1;min-width:0;}
  .ev-time{font-size:12px;color:var(--muted);white-space:nowrap;}
  .ev-acts{display:flex;gap:6px;opacity:0;transition:opacity .15s;}
  .ev-row:hover .ev-acts{opacity:1;}

  /* 折叠 */
  .fold-head{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;}
  .fold-chev{transition:transform .15s;font-size:11px;color:var(--muted);}
  .fold-chev.open{transform:rotate(90deg);}

  /* 图表 */
  .chart-wrap{width:100%;}
  .chart-wrap svg{width:100%;height:auto;display:block;}
  .range-btns{display:flex;gap:4px;}
  .range-btn{border:none;background:transparent;color:var(--muted);font-size:12px;padding:4px 9px;border-radius:6px;cursor:pointer;font-weight:500;}
  .range-btn.on{background:var(--brand-surf);color:var(--brand);font-weight:600;}
  .donut-flex{display:flex;gap:20px;align-items:center;flex-wrap:wrap;}
  .dlegend{display:flex;flex-direction:column;gap:6px;font-size:12px;}
  .dlegend .li{display:flex;align-items:center;gap:7px;}
  .dlegend .lp{margin-left:auto;color:var(--ink2);font-weight:600;}

  .kv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;}
  .detail-back{margin-bottom:2px;}
  .detail-back a{font-size:13px;color:var(--ink2);cursor:pointer;font-weight:500;}

  .rb-hit td{background:var(--brand-surf) !important;}

  .log-line{font-family:"Inter",monospace;font-size:12px;padding:6px 14px;border-bottom:1px solid #F1F3F7;white-space:pre-wrap;}
  .log-line.lv-ERROR{color:var(--danger);}
  .log-line.lv-WARN{color:var(--warn-t);}

/* ---------- 组合派生计算 ---------- */
function pValue(p){ return p.holdings.reduce((s,h)=>{ const a=A(h.sym); return s + (a && a.price!=null ? h.qty*a.price : 0); }, 0); }
function missingPriceHoldings(p){ return p.holdings.filter(h=>{ const a=A(h.sym); return !a || a.price==null; }); }
function pCost(p){ return p.holdings.reduce((s,h)=>s + h.qty*h.cost, 0); }
function pPL(p){ const v=pValue(p), c=pCost(p); return v-c; }
function pPLPct(p){ const c=pCost(p); return c>0 ? (pValue(p)-c)/c*100 : 0; }
function holdingPL(h){ const a=A(h.sym); return a && a.price!=null ? (a.price-h.cost)*h.qty : 0; }
function hasTargets(p){ return !!(p.targets || (p.targetLevel==='asset_class' && p.classTargets)); }
/* 大类级目标 → 资产级目标（按目标大类占比 × 类内当前市值结构摊分；绝不用实际占比冒充目标） */
function assetTargetsFor(p){
  if(p.targetLevel==='asset_class' && p.classTargets){
    const byCls = {}, cnt = {};
    p.holdings.forEach(h=>{ const a=A(h.sym); if(!a) return;
      byCls[a.cls] = (byCls[a.cls]||0) + (a.price!=null ? h.qty*a.price : 0);
      cnt[a.cls] = (cnt[a.cls]||0) + 1; });
    const map = {};
    p.holdings.forEach(h=>{ const a=A(h.sym); if(!a) return;
      const T = p.classTargets[a.cls] || 0, clsVal = byCls[a.cls] || 0;
      map[h.sym] = clsVal>0 ? T*(h.qty*a.price/clsVal) : (cnt[a.cls] ? T/cnt[a.cls] : 0); });
    return map;
  }
  return p.targets || null;
}
function devRows(p){
  const targetMap = assetTargetsFor(p);
  if(!targetMap) return null;
  const total = pValue(p);
  return p.holdings.map(h=>{
    const a = A(h.sym);
    const target = targetMap[h.sym] || 0;
    if(!a || a.price==null){
      return { sym:h.sym, name:a?a.name:h.sym, target, actual:null, abs:null, rel:null,
        overAbs:false, overRel:false, missing:true, flag:'缺价' };
    }
    const actual = total>0 ? (h.qty*a.price)/total*100 : 0;
    const abs = actual - target;
    // 目标为 0 时相对偏离无意义（分母为 0），只按绝对偏离判定；否则 -999 会误报「相对」
    const rel = target>0 ? abs/target*100 : null;
    const overAbs = Math.abs(abs) > p.cfg.abs, overRel = rel!==null && Math.abs(rel) > p.cfg.rel;
    return { sym:h.sym, name:a.name, target, actual, abs, rel, overAbs, overRel, missing:false,
      flag: overAbs&&overRel ? '绝对+相对' : (overAbs?'绝对':(overRel?'相对':'正常')) };
  });
}
/* 大类级口径：首列显示大类中文名（FS A15） */
function classDevRows(p){
  if(!p.classTargets) return null;
  const total = pValue(p), actualVal = {};
  p.holdings.forEach(h=>{ const a=A(h.sym); if(!a || a.price==null) return;
    actualVal[a.cls] = (actualVal[a.cls]||0) + h.qty*a.price; });
  return Object.keys(p.classTargets).map(c=>{
    const target = p.classTargets[c] || 0;
    const actual = total>0 ? (actualVal[c]||0)/total*100 : 0;
    const abs = actual - target;
    const rel = target>0 ? abs/target*100 : null;
    const overAbs = Math.abs(abs) > p.cfg.abs, overRel = rel!==null && Math.abs(rel) > p.cfg.rel;
    return { sym:c, name:clsLabel(c), target, actual, abs, rel, overAbs, overRel, missing:false,
      flag: (overAbs||overRel) ? (overAbs&&overRel?'绝对+相对':(overAbs?'绝对':'相对')) : '正常' };
  });
}
function daysSinceRebal(p){ return p.lastExecutedAt ? daysBetween(p.lastExecutedAt, TODAY) : null; }
/* A4 五种触发原因（常量集中，文案唯一来源） */
const DRIFT_REASON_LABEL = {
  NEVER_EXECUTED:'从未执行过再平衡',
  TIME_INTERVAL_EXCEEDED:'距上次再平衡已超过时间间隔',
  ABSOLUTE_DEVIATION_EXCEEDED:'绝对偏离超过阈值',
  RELATIVE_DEVIATION_EXCEEDED:'相对偏离超过阈值',
  TOTAL_VALUE_ZERO:'组合总市值为 0，无法判定偏离',
};
function driftReasons(p){
  const out = [];
  if(pValue(p) <= 0) out.push('TOTAL_VALUE_ZERO');
  if(p.lastExecutedAt === null) out.push('NEVER_EXECUTED');
  else if(daysSinceRebal(p) >= p.cfg.interval) out.push('TIME_INTERVAL_EXCEEDED');
  const rows = (p.targetLevel==='asset_class' && p.classTargets) ? (classDevRows(p) || []) : (devRows(p) || []);
  if(rows.some(r=>r.overAbs)) out.push('ABSOLUTE_DEVIATION_EXCEEDED');
  if(rows.some(r=>r.overRel)) out.push('RELATIVE_DEVIATION_EXCEEDED');
  return out;
}
/* 四态：超阈(over) > 从未执行(never) > 已到期(due) > 配置正常(ok)；未设目标(none) 独立
   overN 的口径必须与展示表一致：大类模式数「类」，资产模式数「标的」 */
function driftOf(p){
  const targetMap = assetTargetsFor(p);
  if(!targetMap) return { kind:'none', label:'未设目标', chip:'c-gray', overN:0, due:false, ds:null, never:false, missing:0 };
  const assetRows = devRows(p) || [];
  const displayRows = (p.targetLevel==='asset_class' && p.classTargets) ? (classDevRows(p) || assetRows) : assetRows;
  const missing = assetRows.filter(r=>r.missing).length;
  const overN = displayRows.filter(r=>r.flag!=='正常' && r.flag!=='缺价').length;
  const ds = daysSinceRebal(p);
  const never = p.lastExecutedAt === null;
  const due = !never && ds!==null && ds >= p.cfg.interval;
  const base = { overN, due, ds, never, missing };
  if(overN>0) return { kind:'over', label: overN+' 项超阈', chip:'c-amber', ...base };
  if(never)   return { kind:'never', label:'从未执行', chip:'c-blue', ...base };
  if(due)     return { kind:'due', label:'已到期', chip:'c-amber', ...base };
  return { kind:'ok', label:'配置正常', chip:'c-green', ...base };
}

/* ---------- 价格历史（确定性随机游走） ---------- */
function seedRand(str){
  let h = 2166136261;
  for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return function(){ h += 0x6D2B79F5; let t = h; t = Math.imul(t ^ t>>>15, t | 1); t ^= t + Math.imul(t ^ t>>>7, t | 61); return ((t ^ t>>>14) >>> 0) / 4294967296; };
}
function seriesFor(sym, n){
  const a = A(sym); if(!a) return [];
  const rnd = seedRand(sym);
  const vol = a.type==='fund' && a.cls==='cash' ? 0.0008 : (a.type==='bond' ? 0.004 : 0.013);
  const arr = new Array(n);
  let v = a.price;
  for(let i=n-1;i>=0;i--){
    arr[i] = v;
    v = v / (1 + (rnd()-0.5)*2*vol);
  }
  // 日期序列：自然日回溯
  const dates = new Array(n);
  const base = new Date(TODAY + 'T00:00:00');
  for(let i=n-1;i>=0;i--){ const d = new Date(base); d.setDate(base.getDate() - (n-1-i)); dates[i] = d; }
  return arr.map((v,i)=>({ v, d:dates[i] }));
}

/* ---------- 图表 SVG ---------- */
function lineChartSVG(data, w, h, opts){
  opts = opts || {};
  if(!data.length) return '';
  const padL = 54, padR = 16, padT = 12, padB = 26;
  const vs = data.map(d=>d.v);
  let min = Math.min(...vs), max = Math.max(...vs);
  const span = (max-min) || max*0.02 || 1;
  min -= span*0.08; max += span*0.08;
  const X = i => padL + (data.length===1?0:(i/(data.length-1))*(w-padL-padR));
  const Y = v => padT + (1-(v-min)/(max-min))*(h-padT-padB);
  const pts = data.map((d,i)=>X(i).toFixed(1)+','+Y(d.v).toFixed(1)).join(' ');
  const area = padL+','+(h-padB)+' '+pts+' '+X(data.length-1).toFixed(1)+','+(h-padB);
  let grid = '';
  for(let g=0; g<=4; g++){
    const gv = min + (max-min)*g/4;
    const gy = Y(gv);
    grid += `<line x1="${padL}" y1="${gy}" x2="${w-padR}" y2="${gy}" stroke="#F1F3F7"/>`
      + `<text x="${padL-8}" y="${gy+4}" text-anchor="end" font-size="11" fill="${C.muted}">${opts.yFmt?opts.yFmt(gv):gv.toFixed(0)}</text>`;
  }
  const xi = [0, Math.floor((data.length-1)*0.2), Math.floor((data.length-1)*0.4), Math.floor((data.length-1)*0.6), Math.floor((data.length-1)*0.8), data.length-1];
  const xlabels = xi.map(i=>`<text x="${X(i)}" y="${h-8}" text-anchor="middle" font-size="11" fill="${C.muted}">${fmtDateLbl(data[i].d)}</text>`).join('');
  const last = data[data.length-1];
  const gid = 'g' + Math.abs(Math.round(min*1000));
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${C.brand}" stop-opacity="0.22"/><stop offset="100%" stop-color="${C.brand}" stop-opacity="0.02"/>
    </linearGradient></defs>
    ${grid}
    <polygon points="${area}" fill="url(#${gid})"/>
    <polyline points="${pts}" fill="none" stroke="${C.brand}" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${X(data.length-1)}" cy="${Y(last.v)}" r="4" fill="${C.brand}" stroke="#fff" stroke-width="2"/>
    ${xlabels}
  </svg>`;
}
function fmtDateLbl(d){
  return (d.getMonth()+1) + '/' + d.getDate();
}
function sparkSVG(arr, w, h){
  if(!arr || arr.length<2) return '';
  const min = Math.min(...arr), max = Math.max(...arr), rng = (max-min)||1;
  const pts = arr.map((v,i)=>((i/(arr.length-1))*w).toFixed(1)+','+(h-((v-min)/rng)*h).toFixed(1)).join(' ');
  const col = arr[arr.length-1]>=arr[0] ? C.up : C.down;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;"><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/></svg>`;
}
const PALETTE = ['#635BFF','#0EA5E9','#0E9F6E','#F5A524','#8B5CF6','#E0254B','#94A3B8','#14B8A6'];
function donutSVG(items, size, thick){
  const total = items.reduce((s,i)=>s+i.value,0) || 1;
  const r = (size-thick)/2 - 2, cx = size/2, cy = size/2, circ = 2*Math.PI*r;
  let off = 0, segs = '';
  items.forEach((it,i)=>{
    const frac = it.value/total;
    const len = frac*circ;
    segs += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${it.color||PALETTE[i%PALETTE.length]}"
      stroke-width="${thick}" stroke-dasharray="${len.toFixed(2)} ${(circ-len).toFixed(2)}"
      stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 ${cx} ${cy})"/>`;
    off += len;
  });
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">${segs}</svg>`;
}

/* =====================================================
   路由（path + query 双段解析；?sub= / ?record= 驱动深链）
===================================================== */
const DETAIL_TABS = ['overview','positions','position-history','rebalance','transactions'];
window.addEventListener('hashchange', route);
function parseHash(){
  const raw = location.hash.replace(/^#/,'') || '/';
  const qi = raw.indexOf('?');
  const pathPart = qi>=0 ? raw.slice(0,qi) : raw;
  const queryPart = qi>=0 ? raw.slice(qi+1) : '';
  const q = {};
  queryPart.split('&').filter(Boolean).forEach(kv=>{
    const eq = kv.indexOf('=');
    const k = eq>=0 ? kv.slice(0,eq) : kv;
    const v = eq>=0 ? kv.slice(eq+1) : '';
    if(k) q[decodeURIComponent(k)] = decodeURIComponent(v);
  });
  return { parts: pathPart.split('/').filter(Boolean), q };
}
/* next 是不可信输入：必须是站内路径，且不得自身含 next=（防自我嵌套，TASK-060 A-02 / R-2） */
function safeNext(raw){
  if(!raw) return null;
  const v = String(raw).trim();
  if(!v.startsWith('/')) return null;
  if(v.indexOf('next=') >= 0) return null;
  if(v === '/login' || v.startsWith('/login?') || v === '/login/') return null;
  return v;
}
function finish(title, fn){
  $('tbTitle').textContent = title;
  render(fn);
  window.scrollTo(0,0);
}
function route(){
  const { parts, q } = parseHash();
  closeMenu(); gsClose(); setUserMenu(false);
  const path = '/' + parts.join('/');

  /* ---- 未登录守卫（M-04 / FS §4.5）：除 /login 外一律重定向。
     next 只编码 path（不含 query、不含 next=），从根上避免自我嵌套 ---- */
  if(!S.session){
    document.body.classList.add('authed-off');
    if(parts[0] !== 'login'){
      // 根路径不带 next（登录后本来就落 Dashboard）
      location.replace(path === '/' ? '#/login' : '#/login?next=' + encodeURIComponent(path));
      return finish('登录', vLogin);
    }
    return finish('登录', vLogin);
  }
  document.body.classList.remove('authed-off');
  syncUserMenu();

  /* 已登录访问 /login → 回 Dashboard（用 replace，避免回退键回到登录页） */
  if(parts[0] === 'login'){ location.replace('#/'); return; }

  /* 强制改密闸门：除 /account 外一律拦到「需先修改密码」屏，无可跳过入口（§4.2 / D10） */
  if(S.session.mustChangePassword && path !== '/account'){
    setNav('acct');
    return finish('需要修改密码', vForcedChange);
  }

  /* 账户设置 —— M-04 补齐的三条路由之一，不占侧栏导航位。系统设置已独立成页，不再挂 Tab */
  if(parts[0] === 'account' && !parts[1]){
    setNav('acct');
    return finish('账户设置', vAccount);
  }
  /* 系统设置 —— 独立页面（非 /account 子 Tab）；入口在顶栏下拉「账户设置」下方，仅 admin（D13）。
     强制改密闸门在其上方，故 forced 态不会到达此处。 */
  if(parts[0] === 'account' && parts[1] === 'users'){
    if(S.session.role !== 'admin') return finish('无权访问', vForbiddenUsers);
    setNav('acct');
    return finish('系统设置', vUsers);
  }

  let title = 'Dashboard';
  if(parts.length===0){ setNav('root'); render(vDashboard); }
  else if(parts[0]==='portfolios'){
    if(parts[1]==='transactions'){ setNav('ptx'); title='全部交易'; render(vTxAll); }
    else if(parts[1]==='view' && P(parts[2])){
      const pid = parts[2];
      const tabRaw = parts[3] || 'overview';
      // 白名单回落：未知 tab（含历史遗留的 basic）一律落「总览」，不静默渲染交易记录
      const tab = DETAIL_TABS.includes(tabRaw) ? tabRaw : 'overview';
      // 再平衡子 Tab 单一数据源 = URL；非法值回落 suggestions
      const sub = q.sub==='history' ? 'history' : 'suggestions';
      const recordId = q.record || null;
      S.detail.pid = pid; S.detail.tab = tab;
      setNav('plist'); title = P(pid).name;
      render(()=>vPortfolioDetail(pid, tab, sub, recordId));
    } else { setNav('plist'); title='组合管理'; render(vPortfolioList); }
  }
  else if(parts[0]==='prices'){
    if(parts[1] && parts[2]==='history' && A(parts[1])){ setNav('prices'); title = parts[1]+' · 价格历史'; render(()=>vPriceHistory(parts[1])); }
    else { setNav('prices'); title='自选行情'; render(vPrices); }
  }
  else if(parts[0]==='instruments'){
    if(parts[1] && A(parts[1])){ setNav('prices'); title = parts[1]+' · 标的详情'; render(()=>vInstrumentDetail(parts[1])); }
    else { setNav('prices'); title='标的列表'; render(vInstruments); }
  }
  else if(parts[0]==='alerts'){ setNav('alerts'); title='提醒规则'; render(vAlertRules); }
  else if(parts[0]==='logs'){
    /* /logs/rebalance —— 再平衡分发详情（OQ8 独立子路由，非看板卡内展开） */
    if(parts[1]==='rebalance'){
      // 深链初值：?date= / ?portfolio=（OQ8）
      if(q.date) S.rb.date = q.date;
      if(q.portfolio) S.rb.pid = q.portfolio;
      setNav('logs'); title='日志 · 再平衡详情'; render(vRebalanceBoard);
    } else { setNav('logs'); title='日志'; render(vLogs); }
  }
  else { setNav('root'); render(vDashboard); }
  $('tbTitle').textContent = title;
  window.scrollTo(0,0);
}
function render(fn){ $('view').innerHTML = fn(); }
function setNav(key){
  const map = { root:'nav-root', plist:'nav-plist', ptx:'nav-ptx', prices:'nav-prices', alerts:'nav-alerts', logs:'nav-logs' };
  document.querySelectorAll('[data-nav]').forEach(el=>el.classList.remove('on'));
  const parentKeys = ['plist','ptx'];
  if(parentKeys.includes(key)){
    $('nav-portfolios').classList.add('on');
    $('navChildren').style.display = 'flex'; $('navChev').classList.add('open'); S.navChev = true;
  } else if(S.navChev){ $('navChildren').style.display='flex'; $('navChev').classList.add('open'); }
  else { $('navChildren').style.display='none'; $('navChev').classList.remove('open'); }
  const el = $(map[key]); if(el) el.classList.add('on');
}
function toggleNavChev(){
  S.navChev = !S.navChev;
  $('navChildren').style.display = S.navChev ? 'flex' : 'none';
  $('navChev').classList.toggle('open', S.navChev);
}

/* =====================================================
   账户与访问控制（TASK-060 M-01~M-04 / FS-authentication）
   单租户多账号 · admin/member · 无自助注册 · 只停用不删除
   账户与登出的唯一入口 = 顶栏头像下拉；侧栏不提供任何账户入口
===================================================== */
const RE_USERNAME = /^[a-z0-9][a-z0-9_.-]{2,31}$/;
const USERNAME_RULE = '需 3–32 字符，仅小写字母 / 数字 / 下划线 / 点 / 连字符';
const PWD_RULE = '密码长度需 8–72 字符';
let umOpen = false;

function activeAdminCount(){ return USERS.filter(u=>u.role==='admin' && u.active).length; }
function roleChip(r){ return r==='admin' ? '<span class="chip c-purple">管理员</span>' : '<span class="chip c-blue">成员</span>'; }
function roleLabel(r){ return r==='admin' ? '管理员' : '成员'; }

/* --- 顶栏头像下拉（M-03 / A-15）--- */
function syncUserMenu(){
  const s = S.session;
  const menu = $('userMenu');
  if(menu) menu.style.display = s ? '' : 'none';
  if(!s) return;
  if($('umAvatar')) $('umAvatar').textContent = s.username[0].toUpperCase();
  if($('umName')) $('umName').textContent = s.username;
  if($('umRole')) $('umRole').textContent = roleLabel(s.role);   // 弱化文本，不用 chip
  /* 「系统设置」独立页面入口：仅 admin 渲染；强制改密态保留但禁用并说明原因（§4.2 / D10 / D13） */
  const sys = $('umSysRow');
  if(sys){
    sys.hidden = s.role !== 'admin';
    sys.disabled = !!s.mustChangePassword;
    sys.title = s.role !== 'admin' ? '仅管理员可见'
      : (s.mustChangePassword ? '请先完成密码修改后再访问' : '账号与权限管理');
  }
}
function toggleUserMenu(e){ if(e) e.stopPropagation(); setUserMenu(!umOpen); }
function setUserMenu(open){
  umOpen = open;
  const p = $('umPanel'), t = $('umTrigger');

  if(t) t.setAttribute('aria-expanded', open ? 'true' : 'false');

/* --- 登录 / 登出 --- */
function doLogin(u, p){
  const user = USERS.find(x=>x.username === String(u).toLowerCase().trim());
  if(!user || user.password !== p) return {ok:false, err:'用户名或密码错误'};   // 不区分"不存在"与"密码错"
  // 停用态刻意区分文案：账号由管理员创建、停用也是管理员所为，不构成对外泄露（D8 裁决，勿"修正"）
  if(!user.active) return {ok:false, err:'该账号已停用，请联系管理员'};
  S.session = {username:user.username, role:user.role, mustChangePassword:user.mustChangePassword};
  user.lastLoginAt = TODAY + ' 09:12';
  return {ok:true};
}
function doLogout(){
  S.session = null;
  setUserMenu(false); closeModal(); closeMenu();
  go('#/login');
  toast('已退出登录','ok');
}
function submitLogin(){
  const r = doLogin($('lgUser').value, $('lgPwd').value);
  if(!r.ok){ S.loginErr = r.err; render(vLogin); return; }
  S.loginErr = null;
  const { q } = parseHash();
  const next = safeNext(q.next);
  // 默认落 Dashboard（D10）；仅 mustChangePassword 进 /account
  const dest = S.session.mustChangePassword ? '/account' : (next || '/');
  toast(`欢迎，${S.session.username}`,'ok');
  go('#' + dest);
}

/* --- 字段级报错（复用已定义的 .input.err / .ferr）--- */
function markField(id, msg){
  const el = $(id); if(!el) return;
  el.classList.add('err');
  const box = el.parentElement;
  let h = box.querySelector('.ferr');
  if(!h){ h = document.createElement('div'); h.className = 'ferr'; box.appendChild(h); }
  h.textContent = msg;
}
function clearField(id){
  const el = $(id); if(!el) return;
  el.classList.remove('err');
  const h = el.parentElement.querySelector('.ferr');
  if(h) h.remove();
}

/* --- 账户操作 --- */
function saveAccName(){
  const v = ($('accName').value || '').trim().toLowerCase();
  clearField('accName');
  if(!RE_USERNAME.test(v)){ markField('accName', '用户名' + USERNAME_RULE); return; }
  if(v !== S.session.username && USERS.some(u=>u.username === v)){ markField('accName','用户名已存在'); return; }
  const me = USERS.find(u=>u.username === S.session.username);
  if(me) me.username = v;
  S.session.username = v;
  toast('用户名已更新','ok'); route();
}
function saveAccPw(){
  const forced = S.session.mustChangePassword;
  const cur = forced ? null : ($('pwCur') ? $('pwCur').value : '');
  const nw = $('pwNew').value, nw2 = $('pwNew2').value;
  ['pwCur','pwNew','pwNew2'].forEach(clearField);
  if(!forced && !cur){ markField('pwCur','请输入当前密码'); return; }
  // 上界显式拒绝，绝不静默截断（ED-2）
  if(nw.length < 8 || nw.length > 72){ markField('pwNew', PWD_RULE); return; }
  if(nw !== nw2){ markField('pwNew2','两次输入不一致'); return; }
  const me = USERS.find(u=>u.username === S.session.username);
  if(!forced && me && me.password !== cur){ markField('pwCur','当前密码不正确'); return; }
  if(me){ me.password = nw; me.mustChangePassword = false; }
  S.session.mustChangePassword = false;
  toast('密码已修改，其他设备会话已失效','ok');
  if(forced){ go('#/'); } else { route(); }
}
function toggleUserActive(u){
  const t = USERS.find(x=>x.username === u); if(!t) return;
  if(t.username === S.session.username) return toast('不能停用自己','err');
  if(t.active && t.role === 'admin' && activeAdminCount() <= 1) return toast('不能停用最后一个启用管理员','err');
  t.active = !t.active;
  toast(t.active ? `已启用 ${u}` : `已停用 ${u}，其现有会话立即失效`, 'ok');
  route();
}
function changeUserRole(u, r){
  const t = USERS.find(x=>x.username === u); if(!t) return;
  if(t.active && t.role === 'admin' && r === 'member' && activeAdminCount() <= 1){
    toast('不能把最后一个启用管理员降级','err'); route(); return;
  }
  const isSelf = (u === S.session.username);
  t.role = r;
  if(isSelf && r !== 'admin'){
    // 权限即时生效，落 403 是预期行为 —— 但必须说明，否则像页面坏了（D9 连带面）
    S.session.role = 'member';
    toast('你已失去用户管理权限','ok');
    go('#/account');
    return;
  }
  toast(`${u} 角色已改为 ${roleLabel(r)}`,'ok');
  route();
}

  const name = ($('cuName').value || '').toLowerCase().trim();

function doResetPwd(u){
  const t = USERS.find(x=>x.username === u); if(!t) return;
  // 管理员重置自己的密码会清掉自己全部会话、当场被踢下线（D9）

function markRead(id){ const e = EVENTS.find(x=>x.id===id); if(e){ e.unread=false; toast('已标记为已读'); route(); } }
function ignoreEv(id){ EVENTS = EVENTS.filter(x=>x.id!==id); toast('事件已忽略（事件仅可标记，不可删除 · 演示中直接移出列表）'); route(); }
function evalNow(){
  let created = 0;
  RULES.filter(r=>r.on).forEach(r=>{
    let hit = false, text = '';
    if(r.type==='price_above'){ const a=A(r.asset); hit = a && a.price > r.num; text = `${r.asset} · 最新价 ${priceFmt(a)} 高于阈值 ${r.param}`; }
    else if(r.type==='price_below'){ const a=A(r.asset); hit = a && a.price < r.num; text = `${r.asset} · 最新价 ${priceFmt(a)} 低于阈值 ${r.param}`; }
    else if(r.type==='drift'){ const p=P(r.pid); hit = p && driftOf(p).overN>0; text = `${p.name} · 组合偏离触发（${driftOf(p).overN} 项超阈）`; }
    else if(r.type==='signal'){ hit = r.until >= TODAY; text = `${r.asset} · ${r.dir}信号：${r.reason}（有效期至 ${r.until}）`; }
    else if(r.type==='hi52'){ hit = r.asset==='XIC'; text = `${r.asset} · 突破 52 周新高 ${priceFmt(A(r.asset))}`; }
    else if(r.type==='lo52'){ hit = false; }
    else if(r.type==='val'){ hit = false; }
    else if(r.type==='pl'){ hit = false; }
    if(!hit) return;
    if(r.lastFired && daysBetween(r.lastFired, TODAY) < r.cooldown) return; // 静默期
    r.lastFired = TODAY;
    EVENTS.unshift({ id:'e'+(evSeq++), ruleId:r.id, kind:r.type, pid:r.pid, text, time:'刚刚', unread:true,
      link: r.pid ? '#/portfolios/view/'+r.pid+'/rebalance?sub=suggestions' : '#/prices/'+r.asset+'/history' });
    created++;
  });
  toast(created ? `评估完成：${RULES.length} 条规则 · 新增 ${created} 条提醒` : '评估完成：8 条规则 · 新增 0 条（静默期内不重复触发）', created?'ok':'');
  route();
}

function delAsset(sym){
  sym = decodeURIComponent(sym);
  const used = TXNS.some(t=>t.sym===sym);
  if(used){ toast(`「${sym}」存在交易引用，禁止删除（AS-01 可改为停用）`,'err'); return; }
  openModal('删除资产', `
    <p style="font-size:13px;">确认删除资产 <b>${esc(sym)}</b>？该资产无交易引用，可以删除。删除后不可恢复。</p>
  `, `<button class="btn" onclick="closeModal()">取消</button><button class="btn btn-pri" style="background:var(--danger);border-color:var(--danger)" onclick="doDelAsset('${encodeURIComponent(sym)}')">确认删除</button>`);
}
function doDelAsset(sym){
  sym = decodeURIComponent(sym);
  const i = ASSETS.findIndex(a=>a.sym===sym);
  if(i>=0) ASSETS.splice(i,1);
  closeModal(); toast(`已删除 ${sym}`,'ok'); route();
}
function toggleAsset(sym){
  sym = decodeURIComponent(sym);
  const a = A(sym); if(!a) return;
  a.active = !a.active;
  toast(`${sym} 已${a.active?'启用':'停用'}（停用后不参与交易与行情同步）`,'ok'); route();
}

function vPriceHistory(sym){
  const a = A(sym); if(!a) return vPrices();
  S.hist.sym = sym;
  const n = RANGE_N[S.hist.range] || 365;
  const full = seriesFor(sym, 380);
  const data = full.slice(-n);
  const first = data[0].v, last = a.price;
  const periodChg = (last-first)/first*100;
  const lo = Math.min(...data.map(d=>d.v)), hi = Math.max(...data.map(d=>d.v));
  // 月度筛选
  let tableRows = [...full].reverse().filter(x=>!S.hist.month || x.d.toISOString().slice(0,7)===S.hist.month);
  const months = [...new Set(full.map(x=>x.d.toISOString().slice(0,7)))].reverse();
  const prevMap = {}; full.forEach((x,i)=>{ prevMap[i] = i>0 ? full[i-1].v : x.v; });
  const revIdx = [...full.keys()].reverse().filter(i=>!S.hist.month || full[i].d.toISOString().slice(0,7)===S.hist.month);
  tableRows = revIdx.slice(0,12).map(i=>{
    const x = full[i], prev = prevMap[i];
    const chg = (x.v-prev)/prev*100;
    return `<tr><td class="num">${x.d.toISOString().slice(0,10)}</td>
      <td class="num r" style="font-weight:600">${money(x.v,a.ccy,a.type==='fund'?3:2)}</td>
      <td class="num r ${chgCls(chg)}">${pctS(chg)}</td></tr>`;
  }).join('');
  return `
  <div class="detail-back"><a onclick="go('#/instruments/${encodeURIComponent(sym)}')">← 返回标的详情</a></div>
  <div class="card" style="margin:6px 0 16px;">

      <div style="width:52px;height:52px;border-radius:12px;background:var(--brand-surf);color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;">${esc(sym.slice(0,2).toUpperCase())}</div>
      <div><div style="font-size:19px;font-weight:700;">${esc(sym)}</div><div class="ph-desc">${esc(a.name)} · ${MARKET_NAME[a.market]||a.market} · ${a.ccy}</div></div>
      <div><div class="card-sub">当前价格</div><div class="num" style="font-size:26px;font-weight:800;">${priceFmt(a)}</div><div class="card-sub num">${a.ccy} · ${a.days<=0?'实时':'延迟 '+a.days+' 天'}</div></div>
      <div><div class="card-sub">今日涨跌</div><div class="num ${chgCls(a.chg)}" style="font-size:20px;font-weight:700;">${chgArrow(a.chg)} ${pctS(a.chg)}</div><div class="card-sub">${a.chg>0?'看涨':(a.chg<0?'看跌':'平盘')}</div></div>
      <div><div class="card-sub">区间最低 / 最高</div><div class="num" style="font-weight:700;">${money(lo,a.ccy)} – ${money(hi,a.ccy)}</div><div class="card-sub">近 ${S.hist.range}</div></div>
      <div><div class="card-sub">区间变动</div><div class="num ${chgCls(periodChg)}" style="font-size:20px;font-weight:700;">${pctS(periodChg)}</div></div>
    </div>
  </div>
  <div class="card" style="margin-bottom:16px;">
    <div class="card-h">
      <div><div class="card-t">价格走势</div><div class="card-sub">日线 · ${data.length} 个交易日</div></div>
      <div class="spacer"></div>
      <div class="range-btns">${Object.keys(RANGE_N).map(k=>`<button class="range-btn ${S.hist.range===k?'on':''}" onclick="S.hist.range='${k}';route()">${k}</button>`).join('')}</div>

  </div>
  <div class="tbl-wrap">
    <div class="card-h"><span class="card-t">每日价格</span>
      <div class="spacer"></div>
      <select class="select" onchange="S.hist.month=this.value;route()">
        <option value="">全部日期</option>${months.map(m=>`<option value="${m}" ${S.hist.month===m?'selected':''}>${m}</option>`).join('')}
      </select>

/* =====================================================
   视图 · 日志（/logs）—— TASK-061 / FS-cron-worker-status-board
   置顶「任务运行看板」+ 两个原始日志视图（任务日志 / 服务器日志）。
   全频道只读排障：永不出现「执行 / 撤销 / 重做 / 手动触发 / 编辑阈值」（OQ6、AC9）
===================================================== */
const LEVEL_CLASS = { green:'c-green', amber:'c-amber', red:'c-red', gray:'c-gray' };
const LEVEL_DOT   = { green:'#16A34A', amber:'#F59E0B', red:'#DC2626', gray:'#94A3B8' };
const LEVEL_LABEL = { green:'好', amber:'关注', red:'坏', gray:'跳过/未跑' };
const STATE_CLASS = { SUCCEEDED:'c-green', PARTIAL:'c-amber', FAILED:'c-red', SKIPPED:'c-gray' };
const RB_SCHED_LABEL = { daily:'每日', weekly:'每周', monthly:'每月' };
/* 整体徽章只由「数据态」决定 —— 运行态 SUCCEEDED 不参与「全部正常」判定（§2.1 铁律） */
function overallBadge(tasks){
  if(tasks.some(t=>t.dataLevel==='red'))   return ['c-red','存在失败'];
  if(tasks.some(t=>t.dataLevel==='amber')) return ['c-amber','需关注'];
  if(tasks.some(t=>t.dataLevel==='gray'))  return ['c-gray','可能停滞'];
  return ['c-green','全部正常'];
}
function cronCard(t){
  const bar = t.progress!=null
    ? `<div class="pbar"><div class="pbar-f" style="width:${Math.min(100,t.progress)}%"></div></div>`
    : '';   // progress=null 的任务不画 bar，杜绝 NaN / 溢出（R-3）
  const actions = `<a class="link" onclick="S.logs.tab='task';S.logs.task='${t.key}';go('#/logs')">查看日志</a>`
    + (t.detailLink ? ` <a class="link" onclick="go('${t.detailLink}')">查看详情</a>` : '');
  return `<div class="card cron-card"><div class="card-b">
    <div class="head-row"><div class="ph-title">${t.name}</div>
      <span class="chip ${LEVEL_CLASS[t.dataLevel]}" title="数据态：${LEVEL_LABEL[t.dataLevel]}">${LEVEL_LABEL[t.dataLevel]}</span></div>
    <div class="muted" style="margin:4px 0">上次运行 ${t.lastRun}</div>
    <div class="run-state">运行态 ${t.runState}</div>
    ${bar}<div class="knum">${t.keyNumbers}</div>
    ${t.note ? `<div class="note">⚠ ${t.note}</div>` : ''}
    <div class="card-actions">${actions}</div>
  </div></div>`;
}
/* 手动刷新（OQ5：不轮询、无 setInterval）—— 原型无后端，仅推进快照时间并重绘 */
let boardTick = 0;
function refreshBoard(){
  boardTick++;
  const d = new Date(2026,9,26,9,35); d.setMinutes(d.getMinutes() + boardTick*7);
  const p2 = (n)=>String(n).padStart(2,'0');
  CRON_STATUS.snapshotAt = `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}`;
  toast('看板已刷新（手动 · 无自动轮询）','ok'); route();
}

  const f = S.logs;

      ${Object.keys(LEVEL_LABEL).map(k=>`<span class="chip ${LEVEL_CLASS[k]}">${LEVEL_LABEL[k]}</span>`).join('')}
      · 运行态 SUCCEEDED ≠ 数据到位（价格 07:00 写的是上一开市日；完整性检查每天绿却有缺口）</div>

  }
  if(f.tab==='task'){
    let list = TASKRUNS;

       <td><span class="chip ${STATE_CLASS[t.status] || 'c-gray'}">${t.status}</span></td>
       <td class="num muted">${t.time}</td><td class="num r muted">${t.dur}</td>
       <td class="muted">${esc(t.summary)}</td></tr>`).join('');
    return `
    <div class="toolbar">${seg}
      <input class="input" placeholder="按任务名筛选…" value="${esc(f.task)}" oninput="S.logs.task=this.value;route()"/>
      <select class="select" onchange="S.logs.status=this.value;route()">${[['','全部状态'],['SUCCEEDED','SUCCEEDED'],['PARTIAL','PARTIAL'],['FAILED','FAILED'],['SKIPPED','SKIPPED']].map(([v,l])=>`<option value="${v}" ${f.status===v?'selected':''}>${l}</option>`).join('')}</select>
      <span class="count">任务由 cron-worker 唯一调度 · 价格 07:00 · 完整性 03:30 · 提醒 04:00 · 汇率 09:30 · 再平衡 00:00（UTC）</span>
    </div>
    <div class="tbl-wrap"><table class="tb">
      <thead><tr><th>任务</th><th>状态</th><th>开始时间</th><th class="r">时长</th><th>结果摘要</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <div class="fhint" style="margin-top:10px;">注：successCount 在 persistPrice 后计数 —— 任务全绿 ≠ 有新数据；缺口以完整性检查为准。</div>`;
  }
  /* ---- 服务器日志（原 logs 分支，逻辑未动，仅 tab key 改名） ---- */
  let lines = LOGLINES.filter(l=>f.level==='ALL'||l.lv===f.level);
  return `
  <div class="toolbar">${seg}
    ${['ALL','INFO','WARN','ERROR'].map(l=>`<button class="range-btn ${f.level===l?'on':''}" onclick="S.logs.level='${l}';route()">${l}</button>`).join('')}
    <span class="count">按日期 / 级别查询服务日志与后台任务日志</span>
  </div>
  <div class="tbl-wrap" style="padding:8px 0;">${lines.map(l=>`<div class="log-line lv-${l.lv}"><span class="muted">${l.t}</span>  [${l.lv}] ${esc(l.msg)}</div>`).join('') || '<div class="empty">无匹配日志</div>'}</div>`;
}

function tabOverview(p, d){
  const isClass = p.targetLevel==='asset_class' && p.classTargets;
  const rows = isClass ? classDevRows(p) : devRows(p);
  let targetCard;
  if(!rows){
    targetCard = `<div class="card" style="margin-bottom:16px;"><div class="empty"><span class="em">🎯</span>未设目标配置 —— 设置后才能生成再平衡建议<br/>

  } else {

      const st = r.flag==='正常' ? '<span class="chip c-green">正常</span>'
        : (r.flag==='缺价' ? '<span class="chip c-gray">缺价</span>' : `<span class="chip c-amber">${r.flag}</span>`);
      const actTxt = r.actual==null ? '—' : r.actual.toFixed(1)+'%';
      const absTxt = r.abs==null ? '—' : pctS(r.abs,1).replace('%','');

        <td class="num r ${r.overAbs?'warn-text':'muted'}">${absTxt}</td>
        <td class="num r ${r.overRel?'warn-text':'muted'}">${relTxt}</td>
        <td>${st}</td></tr>`;
    }).join('');
    const missing = rows.filter(r=>r.missing).length;
    const reasons = driftReasons(p);
    const reasonText = reasons.length ? reasons.map(k=>DRIFT_REASON_LABEL[k]).join(' · ') : '未触发任何阈值';
    const chip = d.kind==='over' ? `<span class="chip c-amber">${d.overN} 项超阈${d.due?' · 已到期':''}</span>`
      : d.kind==='never' ? '<span class="chip c-blue">从未执行</span>'
      : d.kind==='due' ? '<span class="chip c-amber">已到期</span>'
      : '<span class="chip c-green">配置正常</span>';
    targetCard = `<div class="card" style="margin-bottom:16px;">
      <div class="card-h"><span class="card-t">目标 vs 实际</span>
        ${isClass?'<span class="card-sub">大类级口径 · 首列为大类</span>':''}
        <span class="spacer"></span>${chip}
      </div>
      <table class="tb">
        <thead><tr><th>${isClass?'大类':'标的'}</th><th class="r">目标</th><th class="r">实际</th><th class="r">绝对偏离</th><th class="r">相对偏离</th><th>状态</th></tr></thead>
        <tbody>${tr}</tbody>
      </table>
      ${missing?`<div class="tbl-foot">${missing} 项缺最新价，未能参与偏离判定</div>`:''}
      <div style="padding:12px 18px;display:flex;align-items:center;gap:10px;font-size:13px;background:${reasons.length?'var(--warn-bg)':'transparent'};color:${reasons.length?'var(--warn-t)':'var(--muted)'};">
        触发原因：${reasonText}
        <span class="spacer"></span>
        <button class="btn btn-pri btn-sm" onclick="go('#/portfolios/view/${p.id}/rebalance?sub=suggestions')">去再平衡</button>
      </div>
    </div>`;
  }
  const last = [...REBALS].filter(r=>r.pid===p.id).sort((a,b)=>b.date.localeCompare(a.date))[0];
  const lastCard = last ? `<div class="card" style="margin-bottom:16px;">
    <div class="card-h"><span class="card-sub">最近一次再平衡</span></div>
    <div class="card-b" style="display:flex;align-items:center;gap:12px;">
      <b class="num">${last.date}</b><span class="chip ${last.status==='EXECUTED'?'c-green':(last.status==='PENDING'?'c-amber':'c-gray')}">${REBAL_STATUS[last.status]}</span>
      <span class="muted">${last.mode} · ${last.count} 笔建议</span>

    </div></div>` : `<div class="card" style="margin-bottom:16px;">
    <div class="card-h"><span class="card-sub">最近一次再平衡</span></div>
    <div class="card-b" style="display:flex;align-items:center;gap:12px;">
      <span class="muted">从未执行过再平衡</span>
      <span class="spacer"></span>
      <button class="btn btn-sm" onclick="go('#/portfolios/view/${p.id}/rebalance?sub=suggestions')">去生成建议 →</button>
    </div></div>`;
  const cfg = p.cfg;
  const cfgCard = `<div class="card">
    <div class="card-h fold-head" onclick="S.detail.foldCfg=!S.detail.foldCfg;route()">
      <span class="fold-chev ${S.detail.foldCfg?'open':''}">▶</span>

    </div>`:''}
  </div>`;
  return kpiRow(p) + targetCard + lastCard + cfgCard;
}

function tabPositions(p){

function tabPHistory(p){
  const n = 30;
  const s = seriesFor(p.id, n);
  const scale = pValue(p)/s[n-1];
  const vals = s.map(x=>x.v*scale);
  const rows = [];
  for(let i=n-1;i>=1 && rows.length<12;i--){
    const chg = (vals[i]-vals[i-1])/(vals[i-1]||1)*100;
    rows.push(`<tr><td class="num">${s[i].d.toISOString().slice(0,10)}</td>
      <td class="num r" style="font-weight:600">${money(vals[i],p.ccy)}</td>
      <td class="num r ${chgCls(chg)}">${pctS(chg)}</td>
      <td class="num r muted">${p.holdings.filter(h=>h.qty>0).length} 项</td></tr>`);
  }
  return `
  <div class="card" style="margin-bottom:16px;">
    <div class="card-h"><div><div class="card-t">组合市值走势</div><div class="card-sub">近 30 日 · ${p.ccy} 口径 · 组合内不跨币种加总</div></div></div>

    <thead><tr><th>日期</th><th class="r">总市值</th><th class="r">当日变动</th><th class="r">持仓</th></tr></thead>

function genRebal(pid){
  const p = P(pid);
  if(!hasTargets(p)){ toast('未设目标配置','err'); return; }
  const cash = parseFloat(($('rbCash')&&$('rbCash').value)||0)||0;
  const feeRate = (parseFloat(($('rbFee')&&$('rbFee').value)||0)||0)/100;
  const total = pValue(p) + cash;
  const rows = devRows(p).map(r=>{
    const a = A(r.sym);
    const targetVal = total*r.target/100;
    const curVal = a.price*curQty(pid, r.sym);
    const diff = targetVal - curVal;
    const shares = Math.round(Math.abs(diff)/a.price);
    return { ...r, action: diff>0?'buy':(diff<0?'sell':'hold'), shares: shares>0?shares:0 };
  });
  // 资金约束：卖出所得 + 现金 >= 买入所需
  let avail = cash + rows.filter(r=>r.action==='sell').reduce((s,r)=>s+r.shares*A(r.sym).price,0);
  rows.filter(r=>r.action==='buy').sort((a,b)=>(b.rel||0)-(a.rel||0)).forEach(r=>{
    const cost = r.shares*A(r.sym).price;
    if(cost>avail){ r.shares = Math.floor(avail/A(r.sym).price); }
    avail -= r.shares*A(r.sym).price;
  });
  const buyN = rows.filter(r=>r.action==='buy'&&r.shares>0).length;
  const sellN = rows.filter(r=>r.action==='sell'&&r.shares>0).length;
  const turnover = rows.reduce((s,r)=>s+r.shares*A(r.sym).price,0);
  S.gen[pid] = { rows, stats:{ buy:buyN, sell:sellN, fee:turnover*feeRate }, cash, feeRate };
  toast(`已生成建议：买入 ${buyN} 笔 · 卖出 ${sellN} 笔`,'ok');
  route();
}

function applyTx(p, tx){
  let h = p.holdings.find(x=>x.sym===tx.sym);
  if(tx.action==='buy'){
    if(!h){ h = {sym:tx.sym, qty:0, cost:0}; p.holdings.push(h); }
    h.cost = ((h.qty*h.cost)+(tx.qty*tx.price+(tx.fee||0)))/(h.qty+tx.qty);
    h.qty += tx.qty;
  } else if(tx.action==='sell'){
    if(!h || tx.qty > h.qty) throw new Error('OVERSELL');
    h.qty -= tx.qty;
  } else if(tx.action==='div_reinvest'){
    if(!h){ h = {sym:tx.sym, qty:0, cost:0}; p.holdings.push(h); }
    const gain = tx.qty; // 已换算为份额
    h.cost = ((h.qty*h.cost)+gain*tx.price)/(h.qty+gain);
    h.qty += gain;
  }
  TXNS.push(tx);
}

      <div class="field"><label class="flabel">账户类型（载体）</label><select class="select input-full" id="pfAcc">${accOpts}</select></div>
      <div class="field"><label class="flabel">记账币种（组合内唯一）</label><select class="select input-full" id="pfCcy">${ccyOpts}</select></div>
    </div>
    <div class="field"><label class="flabel">描述</label><input class="input input-full" id="pfDesc" value="${p?esc(p.desc):''}"/></div>
    <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;">
      <span class="switch"><input type="checkbox" id="pfArch" ${p&&p.archived?'checked':''}/><span class="sl"></span></span>归档（≠删除，数据完整保留，退出默认列表与自动调度）
    </label>
    <div class="fhint" style="margin-top:10px;">目标配置保存后可在「设置目标」中按资产级 / 大类级维护（合计须精确 100%）。</div>
  `, `<button class="btn" onclick="closeModal()">取消</button><button class="btn btn-pri" onclick="savePortfolioForm('${pid||''}')">保存</button>`);
}
function savePortfolioForm(pid){
  const name = $('pfName').value.trim();
  if(!name){ toast('名称必填','err'); return; }
  if(pid){
    const p = P(pid);
    Object.assign(p, { name, ptype:$('pfType').value, account:$('pfAcc').value, ccy:$('pfCcy').value, desc:$('pfDesc').value, archived:$('pfArch').checked });
    toast('组合已保存','ok');
  } else {
    PORTFOLIOS.push({ id:'pf'+Date.now(), name, ptype:$('pfType').value, account:$('pfAcc').value, ccy:$('pfCcy').value,
      desc:$('pfDesc').value||'（暂无描述）', targets:null, targetLevel:'asset', classTargets:null,
      cfg:{abs:5,rel:10,interval:60,freq:'monthly'}, archived:false, createdAt:TODAY, lastExecutedAt:null, holdings:[] });
    toast('组合已创建 —— 下一步：录入交易或设置目标','ok');
  }
  closeModal(); route();
}
function openTargetForm(pid){
  const p = P(pid);
  // 空持仓 → 不给输入项（避免残留的假行）
  if(!p.holdings.length){
    openModal('目标配置 · '+esc(p.name), `
      <div class="empty"><span class="em">📭</span>该组合还没有持仓 —— 目标配置需基于至少一个持仓标的<br/>
        <span class="fhint" style="display:block;margin-top:6px;">请先在「交易记录」录入交易，或添加持仓后再设置目标。</span></div>
    `, `<button class="btn btn-pri" onclick="closeModal()">知道了</button>`);
    return;
  }
  const inputs = p.holdings.map((h,i)=>{
    const a = A(h.sym);
    const cur = p.targets ? (p.targets[h.sym]||0) : +(100/p.holdings.length).toFixed(2);
    return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
      <span style="flex:1;font-size:13px;"><b>${h.sym}</b> <span class="muted">${esc(a?a.name:'')}</span></span>
      <input class="input num" style="width:90px;text-align:right;" id="tg_${i}" data-sym="${h.sym}" value="${cur}" oninput="tgSum()"/> %
    </div>`;
  }).join('');
  const isClass = p.targetLevel==='asset_class';
  const classVal = c => (p.classTargets && p.classTargets[c]!=null) ? p.classTargets[c] : 0;
  openModal('目标配置 · '+esc(p.name), `
    <div class="banner banner-amber" style="margin-bottom:14px;">
      <span>ⓘ</span><span class="t">落地形态：本入口跳转 <b>/portfolios/edit/:id</b> 的目标区维护；此弹窗仅为行为演示，实施勿照搬。</span>
    </div>
    <div class="field"><label class="flabel">模式（二选一）</label>
      <div class="radio-row">
        <label><input type="radio" name="tgMode" value="asset" ${isClass?'':'checked'} onchange="document.getElementById('tgAssetBox').style.display='block';document.getElementById('tgClassBox').style.display='none'"/>资产级</label>
        <label><input type="radio" name="tgMode" value="class" ${isClass?'checked':''} onchange="document.getElementById('tgAssetBox').style.display='none';document.getElementById('tgClassBox').style.display='block'"/>大类级</label>
      </div>
      <div class="fhint">大类级目标会按「目标大类占比 × 类内当前市值结构」摊分到具体资产；绝不会用实际占比冒充目标。</div>
    </div>
    <div id="tgAssetBox" style="display:${isClass?'none':'block'}">${inputs}
      <div style="text-align:right;margin-top:6px;">合计 <span class="sum-line num" id="tgSum">0%</span>（必须精确 100%）</div>
    </div>
    <div id="tgClassBox" style="display:${isClass?'block':'none'};">
      ${['equity','bond','gold','cash'].map((c,i)=>`<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
        <span style="flex:1;font-size:13px;">${clsLabel(c)}</span>
        <input class="input num" style="width:90px;text-align:right;" id="tgc_${i}" data-cls="${c}" value="${classVal(c)}" oninput="tgSum()"/> %</div>`).join('')}
      <div style="text-align:right;margin-top:6px;">合计 <span class="sum-line num" id="tgSum2">0%</span>（必须精确 100%）</div>
    </div>
  `, `<button class="btn" onclick="closeModal()">取消</button><button class="btn btn-pri" onclick="saveTargetForm('${pid}')">保存目标</button>`);
  tgSum();
}
function tgSum(){
  let s = 0, s2 = 0, i = 0;
  while($('tg_'+i)){ s += parseFloat($('tg_'+i).value)||0; i++; }
  for(let j=0;j<4;j++){ const el=$('tgc_'+j); if(el) s2 += parseFloat(el.value)||0; }
  const set = (el,v)=>{ if(el){ el.textContent = v.toFixed(1)+'%'; el.className = 'sum-line num '+(Math.abs(v-100)<0.01?'ok':'bad'); } };
  set($('tgSum'), s); set($('tgSum2'), s2);
}
function saveTargetForm(pid){
  const p = P(pid);
  const mode = document.querySelector('input[name="tgMode"]:checked').value;
  if(mode==='asset'){
    const targets = {};
    let s = 0, i = 0;
    while($('tg_'+i)){ const sym = $('tg_'+i).dataset.sym; const v = parseFloat($('tg_'+i).value)||0; targets[sym]=v; s+=v; i++; }
    if(Math.abs(s-100)>0.01){ toast('资产级目标合计必须精确 100%（当前 '+s.toFixed(1)+'%）','err'); return; }
    p.targets = targets; p.targetLevel = 'asset'; p.classTargets = null;
  } else {
    const clsMap = {}; let s = 0;
    ['equity','bond','gold','cash'].forEach((c,j)=>{ const v = parseFloat(($('tgc_'+j)||{}).value)||0; clsMap[c]=v; s+=v; });
    if(Math.abs(s-100)>0.01){ toast('大类级目标合计必须精确 100%（当前 '+s.toFixed(1)+'%）','err'); return; }
    // 保留大类目标本身（不用实际占比冒充）；资产级目标由 assetTargetsFor() 按规则摊分派生
    p.classTargets = clsMap; p.targetLevel = 'asset_class'; p.targets = null;
  }
  closeModal(); toast('目标配置已保存（合计 100%）','ok'); route();
}
function openCfg(pid){
  const p = P(pid); const c = p.cfg;
  openModal('再平衡配置 · '+esc(p.name), `
    <div class="frow3">
      <div class="field"><label class="flabel">绝对偏离（%）</label><input class="input input-full num" id="cfgAbs" value="${c.abs}"/></div>
      <div class="field"><label class="flabel">相对偏离（%）</label><input class="input input-full num" id="cfgRel" value="${c.rel}"/></div>
      <div class="field"><label class="flabel">时间间隔（天）</label><input class="input input-full num" id="cfgIv" value="${c.interval}"/></div>
    </div>
    <div class="field" style="max-width:260px;"><label class="flabel">AUTO 调度频率</label>
      <select class="select input-full" id="cfgFreq">
        ${[['daily','每日'],['weekly','每周'],['monthly','每月']].map(([v,l])=>`<option value="${v}" ${c.freq===v?'selected':''}>${l}</option>`).join('')}
      </select></div>
    <div class="fhint">任一判据触发即提示再平衡；AUTO 只生成待确认建议，永不自动执行。</div>
  `, `<button class="btn" onclick="closeModal()">取消</button><button class="btn btn-pri" onclick="saveCfg('${pid}')">保存</button>`);
}
function saveCfg(pid){
  const p = P(pid);
  p.cfg.abs = parseFloat($('cfgAbs').value)||5;
  p.cfg.rel = parseFloat($('cfgRel').value)||10;
  p.cfg.interval = parseFloat($('cfgIv').value)||60;
  p.cfg.freq = $('cfgFreq').value;
  closeModal(); toast('再平衡配置已保存','ok'); route();
}
function openAssetForm(symE){
  const a = symE ? A(decodeURIComponent(symE)) : null;
  const mktOpts = Object.keys(MARKET_NAME).map(m=>`<option value="${m}" ${a&&a.market===m?'selected':''}>${MARKET_NAME[m]}</option>`).join('');
  const ccyOpts = Object.keys(CCY_NAME).map(c=>`<option value="${c}" ${a&&a.ccy===c?'selected':''}>${c}（${CCY_NAME[c]}）</option>`).join('');
  const typeOpts = [['stock','股票'],['etf','ETF'],['fund','基金'],['bond','债券'],['cash','现金']].map(([v,l])=>`<option value="${v}" ${a&&a.type===v?'selected':''}>${l}</option>`).join('');
  const clsOpts = '<option value="">未分类</option>' + ['equity','bond','gold','cash'].map(c=>`<option value="${c}" ${a&&a.cls===c?'selected':''}>${clsLabel(c)}</option>`).join('');
  openModal(a?'编辑属性 · '+esc(a.sym):'新增资产', `
    <div class="frow">
      <div class="field"><label class="flabel">代码 *（唯一且大写，如 0700.HK / 600519.SS / VTI）</label>
        <input class="input input-full" id="afSym" value="${a?esc(a.sym):''}" ${a?'disabled':''}/></div>
      <div class="field"><label class="flabel">名称 *</label><input class="input input-full" id="afName" value="${a?esc(a.name):''}"/></div>
    </div>
    <div class="frow3">
      <div class="field"><label class="flabel">市场 *</label><select class="select input-full" id="afMkt">${mktOpts}</select></div>
      <div class="field"><label class="flabel">币种 *</label><select class="select input-full" id="afCcy">${ccyOpts}</select></div>
      <div class="field"><label class="flabel">证券类型 *</label><select class="select input-full" id="afType">${typeOpts}</select></div>
    </div>
    <div class="field"><label class="flabel">大类（与证券类型正交 · 黄金ETF 类型=ETF、大类=黄金类）</label><select class="select input-full" id="afCls">${clsOpts}</select></div>
    <div style="display:flex;gap:24px;">
      <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;">
        <span class="switch"><input type="checkbox" id="afActive" ${!a||a.active?'checked':''}/><span class="sl"></span></span>启用（可交易、参与行情同步）
      </label>
      <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;">
        <span class="switch"><input type="checkbox" id="afWatch" ${a&&a.watch?'checked':''}/><span class="sl"></span></span>关注（watchlist）
      </label>
    </div>
    <div class="ferr" id="afErr" style="display:none;"></div>
    <div class="fhint" style="margin-top:8px;">上市日期 launchDate 用于完整性检查推断应有交易日数（当前需直接改库）。</div>
  `, `<button class="btn" onclick="closeModal()">取消</button><button class="btn btn-pri" onclick="saveAssetForm(${a?"'"+encodeURIComponent(a.sym)+"'":'null'})">保存</button>`);
}
function saveAssetForm(symE){
  const old = symE ? A(decodeURIComponent(symE)) : null;
  const sym = (old ? old.sym : $('afSym').value.trim().toUpperCase());
  const name = $('afName').value.trim();
  const err = $('afErr');
  if(!sym || !name){ err.style.display='block'; err.textContent='代码与名称必填'; return; }
  if(!old && ASSETS.some(x=>x.sym===sym)){ err.style.display='block'; err.textContent='代码已存在（代码唯一且大写）'; return; }
  const data = { name, market:$('afMkt').value, ccy:$('afCcy').value, type:$('afType').value, cls:$('afCls').value||null, active:$('afActive').checked, watch:$('afWatch').checked };
  if(old) Object.assign(old, data);
  else ASSETS.push({ sym, ...data, price:0, chg:0, days:99 });
  closeModal(); toast(old?'资产已保存':'资产已创建（新资产建议立即补大类，AS-09）','ok'); route();
}

/* =====================================================
   全局搜索
===================================================== */
function gsSearch(q){
  const drop = $('gsDrop');
  q = (q||'').trim().toLowerCase();
  if(!q){ drop.classList.remove('show'); return; }
  const hits = [];
  ASSETS.filter(a=>a.sym.toLowerCase().includes(q)||a.name.toLowerCase().includes(q)).slice(0,5)
    .forEach(a=>hits.push({ k:a.sym, d:a.name+' · '+MARKET_NAME[a.market], h:'#/instruments/'+encodeURIComponent(a.sym) }));
  PORTFOLIOS.filter(p=>p.name.toLowerCase().includes(q)).slice(0,3)
    .forEach(p=>hits.push({ k:p.name, d:'组合 · '+p.ptype+' · '+p.ccy, h:'#/portfolios/view/'+p.id+'/overview' }));
  drop.innerHTML = hits.length
    ? hits.map(x=>`<div class="gs-item" onmousedown="go('${x.h}')"><span class="k">${esc(x.k)}</span><span class="d">${esc(x.d)}</span></div>`).join('')
    : '<div class="gs-none">没有匹配的资产或组合</div>';
  drop.classList.add('show');
}
function gsClose(){ const d = $('gsDrop'); if(d) d.classList.remove('show'); }
document.addEventListener('click', (e)=>{ if(!e.target.closest('.tb-search')) gsClose(); });

/* =====================================================
   Modal / Toast
===================================================== */
function openModal(title, bodyHtml, footHtml){
  $('modal').innerHTML = `
    <div class="m-head"><span class="m-title">${title}</span><span class="m-x" onclick="closeModal()">✕</span></div>
    <div class="m-body">${bodyHtml}</div>
    <div class="m-foot">${footHtml||''}</div>`;
  $('mask').classList.add('show');
}
function closeModal(){ $('mask').classList.remove('show'); }
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ closeModal(); closeMenu(); gsClose(); } });
function toast(msg, type){
  const t = document.createElement('div');
  t.className = 'toast' + (type ? ' '+type : '');
  t.textContent = msg;
  $('toasts').appendChild(t);
  setTimeout(()=>{ t.style.opacity = '0'; t.style.transition = 'opacity .3s'; setTimeout(()=>t.remove(), 320); }, 2600);
}

/* ---------- 启动 ---------- */
route();
</script>
</body>
</html>
